# Test nodes. CloudLab short hostnames (node0, node1, ...) resolve inside the experiment.
# Adjust the range to match the nodes you have, e.g. node[0:0] for a single node.
# node0..node24 covers every role in scripts/usr_cfg.sh.
[test_nodes]
node[0:24]

[test_nodes:vars]
ansible_user=luoxh
ansible_python_interpreter=/usr/bin/python3
# Uncomment if you SSH with a dedicated key instead of an agent:
# ansible_ssh_private_key_file=/users/luoxh/.ssh/id_rsa_ae
